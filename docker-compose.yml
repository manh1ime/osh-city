services:
  db:
    image: postgres:16-alpine
    container_name: osh-city_db
    restart: unless-stopped
    environment:
      # Local development works with the same defaults as the local connection string.
      # Production deployments can override these values from .env.production.
      POSTGRES_USER: ${POSTGRES_USER:-osh-city}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osh-city}
      POSTGRES_DB: ${POSTGRES_DB:-osh-city}
    volumes:
      - osh-city_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Публичные переменные Next.js вшиваются в бандл на этапе сборки.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    container_name: osh-city_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-osh-city}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-osh-city}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env.production}
      HASH_SALT: ${HASH_SALT:?Set HASH_SALT in .env.production}
      RESTAURANT_SLUG: ${RESTAURANT_SLUG:-osh-city}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env.production}
      # Web Push. Без этих ключей панель работает, но уведомления
      # приходят только в открытую вкладку, а не на телефон сотрудника.
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@osh-city.ru}
    command: ["sh", "/app/docker-entrypoint.sh"]
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  osh-city_pgdata:

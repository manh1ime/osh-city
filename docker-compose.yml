services:
  db:
    image: postgres:16-alpine
    container_name: uchkuduk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: uchkuduk
      POSTGRES_PASSWORD: uchkuduk
      POSTGRES_DB: uchkuduk
    ports:
      # 5433 на хосте, чтобы не конфликтовать с локально установленным PostgreSQL
      - "${DB_PORT:-5433}:5432"
    volumes:
      - uchkuduk_pgdata:/var/lib/postgresql/data

volumes:
  uchkuduk_pgdata:
